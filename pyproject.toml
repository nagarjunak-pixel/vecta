[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vecta"
version = "1.0.0"
description = "Vector search engine: HNSW graph (heuristic neighbour selection, filtered & tombstone search), IVF-PQ with ADC, RaBitQ-style 1-bit codes with re-ranking, BM25 + RRF hybrid retrieval, and bit-exact native C++20 kernels"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Nagarjuna Kamireddy", email = "writetonagarjuna@gmail.com" }]
keywords = ["vector-search", "hnsw", "product-quantization", "ann", "rag", "embeddings"]
dependencies = [
  "numpy>=1.26.0",
  "pydantic>=2.9.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "typer>=0.12.5",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.115.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]

[project.scripts]
vecta = "vecta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vecta"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["vecta"]
